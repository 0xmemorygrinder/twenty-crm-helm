{{- if .Values.worker.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "twenty-helm.fullname" . }}-worker
  labels:
    {{- include "twenty-helm.labels" . | nindent 4 }}
    app.kubernetes.io/component: worker
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "twenty-helm.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: worker
  template:
    metadata:
      labels:
        {{- include "twenty-helm.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: worker
    spec:
      containers:
        - name: twenty-worker
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command:
            - yarn
            - worker:prod
          env:
            {{- if .Values.zalandoPostgresql.enabled }}
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres.{{ .Values.zalandoPostgresql.clusterName }}.credentials.postgresql.acid.zalan.do
                  key: password
            {{- end }}
            - name: SERVER_URL
              value: {{ .Values.server.env.serverUrl | quote }}
            - name: PG_DATABASE_URL
              value: {{ include "twenty-helm.databaseUrl" . | quote }}
            - name: REDIS_URL
              value: {{ include "twenty-helm.redisUrl" . | quote }}
            - name: DISABLE_DB_MIGRATIONS
              value: {{ .Values.worker.env.disableDbMigrations | quote }}
            - name: STORAGE_TYPE
              value: {{ .Values.server.env.storageType | quote }}
            - name: APP_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secrets.existingSecret | default (printf "%s-tokens" (include "twenty-helm.fullname" .)) }}
                  key: {{ .Values.secrets.appSecretKey | default "accessToken" }}
          resources:
            {{- toYaml .Values.worker.resources | nindent 12 }}
{{- end }}