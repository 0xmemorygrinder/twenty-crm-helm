{{- if .Values.redis.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "twenty-helm.fullname" . }}-redis
  labels:
    {{- include "twenty-helm.labels" . | nindent 4 }}
    app.kubernetes.io/component: redis
spec:
  progressDeadlineSeconds: 600
  replicas: {{ .Values.redis.replicaCount | default 1 }}
  strategy:
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 1
    type: RollingUpdate
  selector:
    matchLabels:
      {{- include "twenty-helm.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: redis
  template:
    metadata:
      labels:
        {{- include "twenty-helm.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: redis
    spec:
      containers:
        - name: redis
          image: "{{ .Values.redis.image.repository }}:{{ .Values.redis.image.tag }}"
          imagePullPolicy: {{ .Values.redis.image.pullPolicy }}
          args:
            {{- range .Values.redis.args }}
            - {{ . | quote }}
            {{- end }}
          env:
            - name: PORT
              value: {{ .Values.redis.port | quote }}
          ports:
            - containerPort: {{ .Values.redis.port }}
              name: redis
              protocol: TCP
          resources:
            {{- toYaml .Values.redis.resources | nindent 12 }}
      dnsPolicy: ClusterFirst
      restartPolicy: Always
{{- end }}
