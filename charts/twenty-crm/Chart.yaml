apiVersion: v2
name: twenty-crm
description: A Helm chart for Twenty CRM deployment
type: application
version: 0.1.0
appVersion: "latest"
dependencies:
  - name: redis
    version: 19.6.4
    repository: https://charts.bitnami.com/bitnami
    condition: redis.enabled
  - name: postgresql
    version: 15.5.38
    repository: https://charts.bitnami.com/bitnami
    condition: postgresql.enabled