replicaCount: 1

#namespace: tholgar-infra

image:
  repository: twentycrm/twenty
  pullPolicy: Always
  tag: "latest"

postgres:
  image:
    repository: twentycrm/twenty-postgres-spilo
    tag: "latest"
  enabled: false

server:
  enabled: true
  resources:
    requests:
      memory: "256Mi"
      cpu: "250m"
    limits:
      memory: "1024Mi"
      cpu: "1000m"
  service:
    type: ClusterIP
    port: 3000
  env:
    nodePort: "3000"
    serverUrl: "https://crm.arkenfi.dev:443"
    signInPrefilled: "false"
    storageType: "local"
    accessTokenExpiresIn: "7d"
    loginTokenExpiresIn: "1h"

worker:
  enabled: true
  resources:
    requests:
      memory: "1024Mi"
      cpu: "250m"
    limits:
      memory: "2048Mi"
      cpu: "1000m"
  env:
    disableDbMigrations: "false"

ingress:
  enabled: true
  className: "traefik"
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    traefik.ingress.kubernetes.io/router.tls: "true"
    cert-manager.io/cluster-issuer: "acme"
  hosts:
    - host: crm.arkenfi.dev
      paths:
        - path: /
          pathType: Prefix
  tls:
    - secretName: twenty-crm-tls
      hosts:
        - crm.arkenfi.dev

persistence:
  server:
    enabled: true
    size: 10Gi
    storageClass: ""
    accessMode: ReadWriteOnce
  dockerData:
    enabled: true
    size: 10Gi
    storageClass: ""
    accessMode: ReadWriteOnce

secrets:
  appSecret: ""  # Leave empty to auto-generate a random secret
  existingSecret: ""  # Set to use an existing secret instead of creating one
  appSecretKey: "accessToken"

redis:
  enabled: true
  replicaCount: 1
  image:
    repository: redis/redis-stack-server
    tag: "latest"
    pullPolicy: Always
  port: 6379
  resources:
    requests:
      memory: "1024Mi"
      cpu: "250m"
    limits:
      memory: "2048Mi"
      cpu: "500m"
  # Legacy configuration for external Redis chart
  architecture: standalone
  auth:
    enabled: false
  master:
    resources:
      requests:
        memory: "1024Mi"
        cpu: "250m"
      limits:
        memory: "2048Mi"
        cpu: "500m"

# Zalando PostgreSQL Operator
# Note: Requires the Zalando PostgreSQL Operator to be installed in the cluster
# See: https://github.com/zalando/postgres-operator
zalandoPostgresql:
  enabled: true
  # Team ID for the PostgreSQL cluster
  teamId: "twenty-crm"
  # PostgreSQL cluster name
  clusterName: "twenty-crm-db"
  # Number of PostgreSQL instances
  numberOfInstances: 1
  # PostgreSQL version
  version: "16"
  # Database name
  database: "postgres"
  # Database users
  users:
    postgres: []
  # Volume size for PostgreSQL data
  volume:
    size: 10Gi
    storageClass: ""
  # Resource requests and limits
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 1000m
      memory: 1024Mi
  allowedSourceRanges:
    - 0.0.0.0/0
  # Connection pooler configuration
  enableConnectionPooler: false
  connectionPooler:
    numberOfInstances: 2
    mode: "transaction"
    resources:
      requests:
        cpu: 100m
        memory: 100Mi
      limits:
        cpu: 500m
        memory: 256Mi

externalDatabase:
  enabled: false
  host: ""
  port: 5432
  database: "default"
  username: "postgres"
  password: "postgres"
  existingSecret: ""
  existingSecretPasswordKey: ""

externalRedis:
  enabled: false
  host: ""
  port: 6379
  password: ""
  existingSecret: ""
  existingSecretPasswordKey: ""